packages:
  - apps/*
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: false
  core-js-pure: false
  esbuild: true
  vue-demi: true

# pnpm 10 uses the following equivalent build-script policy.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - '@tarojs/binding'
  - '@tarojs/cli'
  - esbuild
  - vue-demi
ignoredBuiltDependencies:
  - core-js
  - core-js-pure
