services:
  postgres:
    image: postgres:16-alpine
    container_name: flipbelt-challenge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flipbelt_challenge}
      POSTGRES_USER: ${POSTGRES_USER:-flipbelt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ../postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
    container_name: flipbelt-challenge-api
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8100"
