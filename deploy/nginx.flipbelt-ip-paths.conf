# Add these locations inside the existing `server_name 121.41.164.222` block.
# They intentionally use a path prefix so they do not take over other services on port 80.

location = /flipbelt {
    return 301 /flipbelt/;
}

location ^~ /flipbelt/ {
    alias /srv/flipbelt-challenge/participant-h5/;
    try_files $uri $uri/ /flipbelt/index.html;
}

location = /flipbelt-admin {
    return 301 /flipbelt-admin/;
}

location ^~ /flipbelt-admin/ {
    alias /srv/flipbelt-challenge/admin/;
    try_files $uri $uri/ /flipbelt-admin/index.html;
}

location ^~ /flipbelt-api/uploads/ {
    alias /srv/flipbelt-challenge/uploads/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /flipbelt-api/assets/ {
    alias /srv/flipbelt-challenge/assets/;
    autoindex off;
    add_header Cache-Control "public, max-age=3600";
}

location ^~ /flipbelt-api/ {
    proxy_pass http://127.0.0.1:18100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32m;
}
