server {
    listen 80;
    listen [::]:80;
    server_name nzyx.flipbeltchina.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nzyx.flipbeltchina.com;

    ssl_certificate /etc/letsencrypt/live/nzyx.flipbeltchina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nzyx.flipbeltchina.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /flipbelt-api/uploads/ {
        alias /srv/flipbelt-challenge/uploads/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /flipbelt-api/assets/ {
        alias /srv/flipbelt-challenge/assets/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /flipbelt-api/ {
        proxy_pass http://127.0.0.1:18100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 32m;
    }

    # 汇报演示用：保留重构前 3D 卡片堆叠版本，不影响当前首页。
    location ^~ /flipbelt-legacy/ {
        alias /srv/flipbelt-challenge/participant-legacy-h5/;
        try_files $uri $uri/ /flipbelt-legacy/index.html;
    }

    # 微信内置浏览器会强缓存固定二维码入口；入口 HTML 必须每次重新校验，
    # 具体 JS/CSS 仍使用内容哈希文件名，避免旧页面继续引用上一版资源。
    location = / {
        if ($http_user_agent ~* MicroMessenger) {
            return 302 /wx-entry-20260904;
        }
        root /srv/flipbelt-challenge/participant-domain-h5;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 微信扫码使用独立入口路径，绕过固定根地址的 WebView 快照缓存。
    location = /wx-entry-20260904 {
        root /srv/flipbelt-challenge/participant-domain-h5;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        root /srv/flipbelt-challenge/participant-domain-h5;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        alias /srv/flipbelt-challenge/participant-domain-h5/;
        try_files $uri $uri/ /index.html;
    }
}
